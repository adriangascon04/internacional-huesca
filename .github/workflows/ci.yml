name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas
        run: npm install --no-save eslint@8 prettier@3

      - name: Lint
        run: npx eslint "src/**/*.js"

      - name: Formato
        run: npx prettier --check "src/**/*.js"

      - name: Tests
        run: node --import ./tests/setup.js --test tests/*.test.js

      # No hay paso de build: son módulos ES nativos, se sirven tal cual.
      - name: Comprobar que index.html carga main.js
        run: grep -q 'src="./src/main.js"' index.html

      # La cámara del escáner vive en la raíz: es lo que GitHub Pages publica.
      - name: Comprobar que el escáner trae la cámara
        run: |
          grep -q 'id="btn-camara"' index.html
          test -f src/ui/camara.js

  # Las reglas de Firestore son un lenguaje aparte que evalúa el servidor: el
  # lint y los tests de arriba no las miran. Aquí se ejecutan de verdad contra
  # el emulador, con un usuario de cada rol. Va en un job propio porque necesita
  # Java y descargar el emulador, y no queremos ralentizar el resto.
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest ya trae Java, pero fijarlo evita que un cambio de imagen
      # rompa esto sin avisar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar emulador y SDK
        run: npm run test:reglas:instalar

      - name: Probar firestore.rules contra el emulador
        run: npm run test:reglas
