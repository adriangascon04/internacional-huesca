name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas
        run: npm install --no-save eslint@8 prettier@3

      - name: Lint
        run: npx eslint "public/src/**/*.js"

      - name: Formato
        run: npx prettier --check "public/src/**/*.js"

      - name: Tests
        run: node --import ./tests/setup.js --test tests/*.test.js

      # No hay paso de build: son módulos ES nativos, se sirven tal cual.
      - name: Comprobar que index.html carga main.js
        run: grep -q 'src="./src/main.js"' public/index.html
